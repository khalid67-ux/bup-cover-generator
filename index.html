<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUP Assignment Cover Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="page-wrapper">
        <div class="form-container">
            <header class="form-header">
                <div class="icon-circle">🎓</div>
                <h1>BUP Cover Generator</h1>
                <p>Fill in the details to generate your assignment cover.</p>
            </header>

            <form id="coverForm">
                <div class="card">
                    <div class="form-row split">
                        <div class="form-group">
                            <label>Faculty *</label>
                            <select id="faculty" onchange="updateDepartments()" required>
                                <option value="">Select Faculty</option>
                                <option value="Faculty of Science and Technology">Faculty of Science and Technology</option>
                                <option value="Faculty of Business Studies">Faculty of Business Studies</option>
                                <option value="Faculty of Arts and Social Sciences">Faculty of Arts and Social Sciences</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Department *</label>
                            <select id="dept" required>
                                <option value="">Select Department</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row split">
                        <div class="form-group">
                            <label>Course Title *</label>
                            <input type="text" id="courseTitle" placeholder="e.g. digi" required>
                        </div>
                        <div class="form-group">
                            <label>Course Code *</label>
                            <input type="text" id="courseCode" placeholder="e.g. ice3108" required>
                        </div>
                    </div>

                    <div class="form-row split">
                        <div class="form-group">
                            <label>Student Name *</label>
                            <input type="text" id="studentName" placeholder="Md. Khalid Hasan" required>
                        </div>
                        <div class="form-group">
                            <label>Student ID *</label>
                            <input type="text" id="studentId" placeholder="24549010067" required>
                        </div>
                    </div>

                    <div class="form-row split">
                        <div class="form-group">
                            <label>Section</label>
                            <input type="text" id="section" value="A">
                        </div>
                        <div class="form-group">
                            <label>Semester</label>
                            <select id="semester">
                                <option value="1st Semester">1st Semester</option>
                                <option value="2nd Semester">2nd Semester</option>
                                <option value="3rd Semester">3rd Semester</option>
                                <option value="4th Semester">4th Semester</option>
                                <option value="5th Semester">5th Semester</option>
                                <option value="6th Semester">6th Semester</option>
                                <option value="7th Semester">7th Semester</option>
                                <option value="8th Semester">8th Semester</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Submission Date</label>
                        <input type="date" id="subDate" required>
                    </div>

                    <div class="submitted-to-box">
                        <h4>Submitted To</h4>
                        <div class="form-row split">
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" id="teacherName" placeholder="Md Paranto">
                            </div>
                            <div class="form-group">
                                <label>Designation</label>
                                <input type="text" id="teacherDesignation" placeholder="Lecturer">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" id="teacherDept" placeholder="Department of ICT">
                        </div>
                    </div>

                    <button type="button" class="btn-generate" onclick="generatePDF()">Download Cover Page (PDF)</button>
                </div>
            </form>
        </div>
    </div>

    <div id="pdf-container" style="position: absolute; left: -9999px;">
        <div id="pdf-template" style="width: 210mm; min-height: 297mm; padding: 20mm; background: white; color: black; font-family: 'Times New Roman', Times, serif; box-sizing: border-box; display: flex; flex-direction: column;">
            
            <div style="text-align: center;">
                <h1 style="color: #238a44; font-size: 26pt; margin: 0;">Bangladesh University of Professionals</h1>
                <img src="logo.png" style="width: 120px; margin: 25px auto; display: block;">
                <p id="pFaculty" style="font-weight: bold; font-size: 16pt; margin: 5px 0;"></p>
                <p id="pDept" style="font-weight: bold; font-size: 14pt; margin: 0;"></p>
                
                <h1 style="font-size: 48pt; color: #5bc0de; margin: 50px 0 30px 0;">Assignment</h1>
                
                <p style="font-size: 20pt; margin: 10px 0;"><strong>Course Title:</strong> <span id="pTitle"></span></p>
                <p style="font-size: 20pt; margin: 10px 0;"><strong>Course Code:</strong> <span id="pCode"></span></p>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 80px; padding: 0 10px;">
                <div style="width: 48%; text-align: left;">
                    <h3 style="font-size: 18pt; margin-bottom: 15px;">Submitted By</h3>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Name:</strong> <span id="pName"></span></p>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Student ID:</strong> <span id="pId"></span></p>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Section:</strong> <span id="pSection"></span></p>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Semester:</strong> <span id="pSemester"></span></p>
                </div>
                <div style="width: 48%; text-align: left;">
                    <h3 style="font-size: 18pt; margin-bottom: 15px;">Submitted To</h3>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Name:</strong> <span id="pTName"></span></p>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Designation:</strong> <span id="pTDesig"></span></p>
                    <p style="font-size: 14pt; margin: 8px 0;"><strong>Department:</strong> <span id="pTDept"></span></p>
                </div>
            </div>

            <div style="margin-top: auto; padding-bottom: 40px; text-align: center;">
                <p style="font-size: 16pt;"><strong>Submission Date:</strong> <span id="pDate"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
