<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Public Feedback</title>

<link rel="stylesheet" href="style.css">

<style>

body
  
  {
    background:#edf7ef;
}

.feedback-page{

    max-width:900px;
    margin:60px auto;
    background:#fff;
    padding:40px;
    border-radius:28px;
}

.feedback-page h1{

    text-align:center;
    color:#238a44;
    font-size:58px;
    margin-bottom:40px;
}

.feedback-section input,
.feedback-section textarea{

    width:100%;
    padding:18px;
    border:1px solid #ccc;
    border-radius:16px;
    font-size:18px;
    margin-bottom:20px;
    box-sizing:border-box;
}

.feedback-section textarea{

    min-height:120px;
}

.feedback-section button{

    background:#2563eb;
    color:white;
    border:none;
    padding:16px 30px;
    border-radius:16px;
    font-size:20px;
    cursor:pointer;
}

.feedback-card{

    background:#f5f7fa;
    padding:25px;
    border-radius:20px;
    margin-top:25px;
}

.admin-reply{

    background:#dff0ff;
    padding:20px;
    border-left:5px solid #0a84d6;
    border-radius:14px;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="feedback-page">

<h1>Public Feedback</h1>

<section class="feedback-section">

<input
    type="text"
    id="name"
    placeholder="Your Name">

<textarea
    id="message"
    placeholder="Write your feedback"></textarea>

<button onclick="submitFeedback()">

    Submit Feedback

</button>

<div id="feedbackList"></div>

</section>

</div>

<footer
    style="
        text-align:center;
        margin-top:30px;
        padding:20px;
        color:#4a5568;
        font-size:14px;
    ">

    <div style="margin-bottom:12px;">

        <a
            href="about.html"
            style="
                margin:0 10px;
                color:#2563eb;
                text-decoration:none;
            ">

            About

        </a>

        |

        <a
            href="about.html"
            style="
                margin:0 10px;
                color:#2563eb;
                text-decoration:none;
            ">

            Privacy Policy

        </a>

        |

        <a
            href="about.html"
            style="
                margin:0 10px;
                color:#2563eb;
                text-decoration:none;
            ">

            Contact

        </a>

    </div>

    <p style="margin:8px 0;">

        © 2026 BUP Academic Cover Generator

    </p>

    <p style="margin-top:8px;">

        Developed by

        <a
            href="https://khalid67-ux.github.io/"
            target="_blank"
            style="
                color:#2563eb;
                text-decoration:none;
                font-weight:500;
            ">

            Md. Khalid Hasan

        </a>

        | ICT Student

    </p>

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyDtRJyTXykmMq6Q5_P1IUYUhUsIP95tYO4",

  authDomain: "bup-cover-feedback.firebaseapp.com",

  projectId: "bup-cover-feedback",

  storageBucket: "bup-cover-feedback.firebasestorage.app",

  messagingSenderId: "344205749988",

  appId: "1:344205749988:web:a0bc753a94e2f95c7946f1",

  measurementId: "G-S6VZKH2XR5"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.submitFeedback = async function () {

  const name = document.getElementById("name").value;

  const message = document.getElementById("message").value;

  if (!name || !message) {

    alert("Please fill all fields");

    return;
  }

  await addDoc(collection(db, "feedbacks"), {

    name,
    message,
    reply: "",
    createdAt: Date.now()

  });

  document.getElementById("name").value = "";

  document.getElementById("message").value = "";
};

const q = query(

  collection(db, "feedbacks"),

  orderBy("createdAt", "desc")

);

onSnapshot(q, (snapshot) => {

  const feedbackList =
      document.getElementById("feedbackList");

  feedbackList.innerHTML = "";

  snapshot.forEach((doc) => {

    const data = doc.data();

    feedbackList.innerHTML += `

      <div class="feedback-card">

        <strong>${data.name}</strong>

        <p>${data.message}</p>

        ${data.reply ? `

          <div class="admin-reply">

            <strong>Admin Reply:</strong>

            <p>${data.reply}</p>

          </div>

        ` : ""}

      </div>

    `;
  });
});

</script>

</body>
</html>
