<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Public Feedback</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#edf7ef;
}

/* MAIN WRAPPER */

.feedback-wrapper{

    max-width:900px;
    margin:60px auto;
}

/* CARD */

.feedback-page{

    background:#fff;
    padding:40px;
    border-radius:28px;
    box-sizing:border-box;
    margin-bottom:30px;
}

/* TITLE */

.feedback-page h1{

    text-align:center;
    color:#238a44;
    font-size:40px;
    margin-bottom:40px;
}

/* INPUT */

.feedback-section input,
.feedback-section textarea{

    width:100%;
    padding:18px;
    border:1px solid #ccc;
    border-radius:16px;
    font-size:18px;
    margin-bottom:20px;
    box-sizing:border-box;
}

/* TEXTAREA */

.feedback-section textarea{

    min-height:120px;
}

/* BUTTON */

.feedback-section button{

    background:#2563eb;
    color:white;
    border:none;
    padding:16px 30px;
    border-radius:16px;
    font-size:20px;
    cursor:pointer;

    display:block;
    margin:0 auto;
}

/* COMMENT CARD */

.feedback-card{

    background:#f5f7fa;
    padding:25px;
    border-radius:20px;
    margin-top:25px;
}

/* ADMIN REPLY */

.admin-reply{

    background:#dff0ff;
    padding:20px;
    border-left:5px solid #0a84d6;
    border-radius:14px;
    margin-top:20px;
}

/* MOBILE */

@media (max-width: 768px){

    .feedback-wrapper{

        width: calc(100% - 24px);
        margin: 25px 12px;
    }

    .feedback-page{

        padding:22px;
        border-radius:22px;
    }

    .feedback-page h1{

        font-size:38px;
        margin-bottom:28px;
    }

    .feedback-section input,
    .feedback-section textarea{

        font-size:16px;
        padding:14px;
        border-radius:14px;
    }

    .feedback-section textarea{

        min-height:110px;
    }

    .feedback-section button{

        width:100%;
        padding:15px;
        font-size:18px;
        border-radius:14px;
    }

    .feedback-card{

        padding:18px;
        border-radius:16px;
    }

    .feedback-card strong{

        font-size:22px;
    }

    .feedback-card p{

        font-size:16px;
        line-height:1.6;
        word-break:break-word;
    }

    .admin-reply{

        padding:16px;
        border-radius:12px;
    }
}

</style>

</head>

<body>

<nav class="navbar">

    <div class="nav-container">

            <li>

        </ul>

    </div>

</nav>

<!-- MAIN WRAPPER -->

<div class="feedback-wrapper">

    <!-- SUBMIT CARD -->

    <div class="feedback-page">

        <h1>Share Your Feedback</h1>

        <section class="feedback-section">

            <input
                type="text"
                id="name"
                placeholder="Your Name">

            <textarea
                id="message"
                placeholder="Write your feedback"></textarea>

            <button onclick="submitFeedback()">

                Submit Feedback

            </button>

        </section>

    </div>

    <!-- COMMENTS CARD -->

    <div class="feedback-page">

        <h1>
            

            Community Reviews

        </h1>

        <div id="feedbackList"></div>

    </div>

</div>

<footer
    style="
        text-align:center;
        margin-top:30px;
        padding:20px;
        color:#4a5568;
        font-size:14px;
    ">

    <div style="margin-bottom:12px;">

        <a
            href="about.html"
            style="
                margin:0 10px;
                color:#2563eb;
                text-decoration:none;
            ">

        <a

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyDtRJyTXykmMq6Q5_P1IUYUhUsIP95tYO4",

  authDomain: "bup-cover-feedback.firebaseapp.com",

  projectId: "bup-cover-feedback",

  storageBucket: "bup-cover-feedback.firebasestorage.app",

  messagingSenderId: "344205749988",

  appId: "1:344205749988:web:a0bc753a94e2f95c7946f1",

  measurementId: "G-S6VZKH2XR5"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.submitFeedback = async function () {

  const name = document.getElementById("name").value;

  const message = document.getElementById("message").value;

  if (!name || !message) {

    alert("Please fill all fields");

    return;
  }

  await addDoc(collection(db, "feedbacks"), {

    name,
    message,
    reply: "",
    createdAt: Date.now()

  });

  document.getElementById("name").value = "";

  document.getElementById("message").value = "";
};

const q = query(

  collection(db, "feedbacks"),

  orderBy("createdAt", "desc")

);

onSnapshot(q, (snapshot) => {

  const feedbackList =
      document.getElementById("feedbackList");

  feedbackList.innerHTML = "";

  snapshot.forEach((doc) => {

    const data = doc.data();

    feedbackList.innerHTML += `

      <div class="feedback-card">

        <strong>${data.name}</strong>

        <p style="margin-top:15px;">
            ${data.message}
        </p>

        ${data.reply ? `

          <div class="admin-reply">

            <strong>Admin Reply:</strong>

            <p style="margin-top:12px;">
                ${data.reply}
            </p>

          </div>

        ` : ""}

      </div>

    `;
  });
});

</script>
